# Base Configuration for SNA Twitch Influencer Project
# =====================================================
# This file contains core parameters for the analysis pipeline.
# All parameters should be documented with their rationale.

# Project info
project:
  name: "SNA Twitch Influencer Analysis"
  version: "3.0"
  seed: 42

# Data paths (relative to project root)
paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"
  outputs: "outputs"
  reports: "reports"

# Centrality computation parameters
centrality:
  # Betweenness centrality approximation parameters
  # CHANGE-5: k=1000 with seed=42 as per implementation plan
  betweenness:
    k_pivots: 1000  # Number of pivot nodes for approximation
    seed: 42        # Random seed for reproducibility
    note: "k=1000 on N~163K active nodes gives ~3% error bound per Brandes (2001)"

  # PageRank parameters
  pagerank:
    alpha: 0.85     # Damping factor
    max_iter: 100   # Maximum iterations
    tol: 1.0e-06    # Convergence tolerance

# Community detection parameters
community:
  # Louvain algorithm
  louvain:
    n_runs: 10              # Number of runs for stability check (CHANGE-4)
    resolution: 1.0         # Resolution parameter
    seed_start: 0           # Starting seed (will use seeds 0-9)
    nmi_threshold: 0.85     # Minimum acceptable NMI for stability

# SIS (Structural Influence Score) parameters
sis:
  # FORBIDDEN-1: SIS formula is UNWEIGHTED per proposal Section 6
  # SIS(v) = [rank(PageRank) + rank(Betweenness) + rank(k-shell)] / 3
  formula: "unweighted_rank_average"
  note: "DO NOT add weights - formula is fixed per proposal"

# Typology parameters
typology:
  threshold_default: 0.20   # Top 20% for both SIS and views
  thresholds_sensitivity:   # For robustness analysis
    - 0.15
    - 0.20
    - 0.25
  jaccard_target: 0.70      # Minimum Jaccard stability target

# IC Simulation parameters
# CHANGE-6: Pilot calibration parameters per implementation plan
ic_simulation:
  pilot:
    subgraph_fraction: 0.10   # 10% subgraph for pilot (not 20%)
    p_values_to_test:         # p values to test in pilot
      - 0.01
      - 0.03
      - 0.05
    n_seeds: 10               # Number of seeds per p value
    n_runs_per_seed: 50       # Runs per seed
    target_range_min: 5.0     # Target: mean_reach/N >= 5% (not 8%)
    target_range_max: 30.0    # Target: mean_reach/N <= 30% (not 25%)

  single_seed:
    n_runs: 50                # Runs per seed node
    seed: 42

  multi_seed:
    k_seeds: 50               # Number of seeds per strategy
    n_runs: 300               # Runs for main benchmark
    n_runs_robustness: 50     # Runs for robustness check (NUANCED-1)

# ML parameters
# FORBIDDEN-2: Only LR baselines per proposal Section 5
ml:
  models:
    - "majority_class"
    - "lr_views_only"
    - "lr_degree_only"
    - "lr_views_degree"
  # Note: NO RandomForest, NO SHAP - only LR baselines per proposal

  split:
    train: 0.70
    val: 0.10
    test: 0.20
    stratify: true

  # NUANCED-2: 5-fold CV for variance estimation only
  cv_folds: 5
  cv_note: "5-fold CV is supplementary for variance estimation. Primary result is 70/10/20 split."

# Statistical testing parameters
# CHANGE-7: BH correction with effect sizes
stats:
  alpha: 0.05
  correction_method: "fdr_bh"  # Benjamini-Hochberg
  effect_size_metric: "rank_biserial"  # rank-biserial r
  output_columns:
    - "effect_size_r"
    - "p_raw"
    - "p_corrected_bh"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
